name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
      - run: yarn test:build

  # The default devDependencies track the newest supported peers (wagmi 3,
  # cross-app-connect 0.7). This job re-checks the oldest declared peer range.
  compat-oldest-peers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn add -D wagmi@^2.14.0 @privy-io/cross-app-connect@0.5.12 viem@2.52.0
      - run: yarn typecheck
      - run: yarn test
      - run: yarn build
